<foreignObject class="legend-foreign" x="120" y="1872" width="2320" height="416"><div xmlns="http://www.w3.org/1999/xhtml" class="legend-grid"><div class="legend-row"><div class="attention-legend" data-family="full" style="--legend-color:#147565" tabindex="0" role="button" aria-pressed="false" aria-label="展开 Full Attention 说明并高亮对应模型"><div class="legend-box"><div class="legend-heading"><i class="legend-swatch" aria-hidden="true"></i><span class="legend-title">Full Attention</span></div><div class="legend-copy"><div class="legend-copy-clip"><div class="legend-copy-body"><p>Full 指的是<strong>每个 query token 会访问全部因果可见的历史 token</strong>。</p><p>GQA/MQA 描述 <strong>KV entry 如何在 query heads 之间共享</strong>。</p><ul><li><strong>GQA (Grouped-Query Attention)</strong>：每组 query heads 共享相同的 KV。</li><li><strong>MQA (Multi-Query Attention)</strong>：所有 query heads 共享相同的 KV。</li></ul><p><strong>Gated Attention</strong> 对输出增加一次门控。</p></div></div></div></div></div><div class="attention-legend" data-family="latent" style="--legend-color:#315FA8" tabindex="0" role="button" aria-pressed="false" aria-label="展开 MLA 说明并高亮对应模型"><div class="legend-box"><div class="legend-heading"><i class="legend-swatch" aria-hidden="true"></i><span class="legend-title">MLA</span></div><div class="legend-copy"><div class="legend-copy-clip"><div class="legend-copy-body"><p><strong>MLA (Multi-head Latent Attention)</strong> 用低维 latent 压缩表示 KV entry。</p><p>减少 KV cache 的 <strong>bytes/entry</strong>；不减少历史 entry 数量。</p><p><strong>Gated MLA</strong> 同样对输出增加一次门控。</p></div></div></div></div></div><div class="attention-legend" data-family="delta" style="--legend-color:#A45D15" tabindex="0" role="button" aria-pressed="false" aria-label="展开 Linear Attention 说明并高亮对应模型"><div class="legend-box"><div class="legend-heading"><i class="legend-swatch" aria-hidden="true"></i><span class="legend-title">Linear Attention</span></div><div class="legend-copy"><div class="legend-copy-clip"><div class="legend-copy-body"><p>Linear 指的是<strong>计算量 FLOPs 随序列长度线性增长</strong>。</p><p>同时用<strong>固定大小</strong>的递推状态保存历史信息。</p><ul><li><strong>Lightning Attention</strong>：输入无关的衰减；不做 delta-rule 校正。</li><li><strong>GDN (Gated DeltaNet)</strong>：输入相关的标量衰减 + delta-rule 校正。</li><li><strong>KDA (Kimi Delta Attention)</strong>：标量衰减扩展为 key feature 逐维衰减。
  保留与 GDN 相同的 delta-rule 误差校正。</li></ul></div></div></div></div></div></div><div class="legend-row"><div class="attention-legend" data-family="sparse" style="--legend-color:#A83E6F" tabindex="0" role="button" aria-pressed="false" aria-label="展开 Sparse Attention 说明并高亮对应模型"><div class="legend-box"><div class="legend-heading"><i class="legend-swatch" aria-hidden="true"></i><span class="legend-title">Sparse Attention</span></div><div class="legend-copy"><div class="legend-copy-clip"><div class="legend-copy-body"><p>Sparse 指的是<strong>每个 query token 只选择部分历史 token 访问</strong>。</p><p>减少 core attention FLOPs；稀疏选择本身不减少 KV cache。</p><ul><li><strong>DSA (DeepSeek Sparse Attention)</strong>：MLA 的 MQA mode + lightning indexer。</li><li><strong>CSA/CSA2</strong>：sequence compressor + MLA，再选择压缩 KV entries。</li><li><strong>QSA (Qwen Sparse Attention)</strong>：无 MLA；MQA indexer 按 block 选择。</li><li><strong>MSA (MiniMax Sparse Attention)</strong>：按 GQA group 选择 Top-K KV blocks。</li></ul></div></div></div></div></div><div class="attention-legend" data-family="compressed" style="--legend-color:#7350A6" tabindex="0" role="button" aria-pressed="false" aria-label="展开 Compressed Attention 说明并高亮对应模型"><div class="legend-box"><div class="legend-heading"><i class="legend-swatch" aria-hidden="true"></i><span class="legend-title">Compressed Attention</span></div><div class="legend-copy"><div class="legend-copy-clip"><div class="legend-copy-body"><p>Compressed 指的是<strong>将多个 token 的 KV entry 合并为一个压缩向量表示</strong>。</p><p>减少 KV cache 的 <strong>entries/layer</strong>，同时减少 FLOPs。</p><ul><li><strong>CSA (Compressed Sparse Attention) / CSA2 (Compressed Sparse Attention 2)</strong>：压缩后运行 DSA。</li><li><strong>HCA (Heavily Compressed Attention)</strong>：高压缩率后运行 Full Attention。</li></ul></div></div></div></div></div><div class="attention-legend" data-family="window" style="--legend-color:#B34238" tabindex="0" role="button" aria-pressed="false" aria-label="展开 Sliding-Window Attention 说明并高亮对应模型"><div class="legend-box"><div class="legend-heading"><i class="legend-swatch" aria-hidden="true"></i><span class="legend-title">Sliding-Window Attention</span></div><div class="legend-copy"><div class="legend-copy-clip"><div class="legend-copy-body"><p><strong>SWA (Sliding-Window Attention)</strong>：每个 query 只访问局部窗口。</p><p>保留邻近 token 的精确细节；远处信息需要跨层传递。</p></div></div></div></div></div></div></div></foreignObject>

<script>
(() => {
  const svg = document.getElementById('genealogy');
  const panel = document.getElementById('details');
  const body = panel.querySelector('.detail-content');
  const hint = panel.querySelector('.detail-hint');
  const nodes = [...svg.querySelectorAll('.model[data-node]')];
  const edges = [...svg.querySelectorAll('.edge-group[data-source][data-target]')];
  const legends = [...svg.querySelectorAll('.attention-legend[data-family]')];
  let active = null, pinned = false, timer, restoring = false;
  let hoverDismissed = false;
  let hoveredLegend = null, focusedLegend = null, pinnedLegend = null;
  const target = event => event.target.closest?.('[data-detail]');
  const legendTarget = event => event.target.closest?.('.attention-legend[data-family]');
  const cancel = () => clearTimeout(timer);

  function highlight(item) {
    const legend = hoveredLegend || focusedLegend || pinnedLegend;
    const selected = item?.dataset.node;
    const ids = new Set(selected ? [selected] : [item?.dataset.source, item?.dataset.target]);
    edges.forEach(edge => {
      const matches = !legend && (selected ? edge.dataset.source === selected || edge.dataset.target === selected : edge === item);
      edge.classList.toggle('is-active', !!matches);
      if (matches) { ids.add(edge.dataset.source); ids.add(edge.dataset.target); }
    });
    nodes.forEach(node => node.classList.toggle('is-active', legend
      ? (node.dataset.families || '').split(' ').includes(legend.dataset.family)
      : !!item && ids.has(node.dataset.node)));
    legends.forEach(entry => {
      entry.classList.toggle('is-active', entry === legend);
      entry.setAttribute('aria-pressed', String(entry === pinnedLegend));
    });
    svg.classList.toggle('has-active', !!(legend || item));
  }

  function position() {
    if (!active) return;
    const box = active.getBoundingClientRect();
    const viewport = document.documentElement;
    panel.style.maxHeight = '';
    let below = true;
    if (active.dataset.node) {
      const spaceBelow = Math.max(0, viewport.clientHeight - box.bottom - 24);
      const spaceAbove = Math.max(0, box.top - 24);
      below = spaceBelow >= 180 || spaceBelow >= spaceAbove;
      panel.style.maxHeight = Math.min(650, viewport.clientHeight * .7, below ? spaceBelow : spaceAbove) + 'px';
    }
    const width = panel.offsetWidth, height = panel.offsetHeight;
    let left, top;
    if (active.dataset.node) {
      left = box.left + (box.width - width) / 2;
      top = below ? box.bottom + 12 : box.top - height - 12;
    } else {
      left = box.right + 12;
      if (left + width > viewport.clientWidth - 12) left = box.left - width - 12;
      top = box.top;
    }
    panel.style.left = Math.max(12, Math.min(left, viewport.clientWidth - width - 12)) + 'px';
    panel.style.top = Math.max(12, Math.min(top, viewport.clientHeight - height - 12)) + 'px';
  }

  function show(item, lock = false) {
    if (!item || (pinned && item !== active && !lock)) return;
    const template = document.getElementById('detail-' + item.dataset.detail);
    if (!(template instanceof HTMLTemplateElement)) return;
    cancel();
    if (lock) hoveredLegend = focusedLegend = pinnedLegend = null;
    if (active !== item) {
      active?.setAttribute('aria-expanded', 'false');
      active = item;
      body.replaceChildren(template.content.cloneNode(true));
      panel.scrollTop = 0;
    }
    highlight(item);
    pinned = pinned || lock;
    active.setAttribute('aria-expanded', 'true');
    hint.textContent = pinned ? '已固定 · Esc 关闭' : '点击节点或箭头固定 · Esc 关闭';
    panel.hidden = false;
    position();
  }

  function close(restore = false, dismiss = false) {
    cancel();
    if (dismiss) hoverDismissed = true;
    const origin = active;
    active?.setAttribute('aria-expanded', 'false');
    active = null;
    pinned = false;
    panel.hidden = true;
    highlight(null);
    if (restore && origin) {
      restoring = true;
      origin.focus({ preventScroll: true });
      restoring = false;
    }
  }

  function later(event) {
    if (pinned || panel.contains(event.relatedTarget) || active?.contains(event.relatedTarget)) return;
    cancel();
    timer = setTimeout(() => { if (!pinned) close(); }, 240);
  }

  function previewLegend(entry, focus = false) {
    cancel();
    if (!pinned) close();
    if (focus) focusedLegend = entry;
    else hoveredLegend = entry;
    highlight(active);
  }

  function toggleLegend(entry) {
    const next = pinnedLegend === entry ? null : entry;
    hoveredLegend = focusedLegend = null;
    pinnedLegend = next;
    close();
  }

  function preview(event) {
    if (event.pointerType === 'touch') return;
    const entry = legendTarget(event);
    if (entry) previewLegend(entry);
    else show(target(event));
  }
  svg.addEventListener('pointerover', event => {
    if (!hoverDismissed) preview(event);
  });
  // Hiding a popup can expose a node under a stationary pointer; wait for movement.
  svg.addEventListener('pointermove', event => {
    if (hoverDismissed) {
      hoverDismissed = false;
      preview(event);
    }
  });
  svg.addEventListener('pointerout', event => {
    const entry = legendTarget(event);
    if (!entry) return later(event);
    if (!entry.contains(event.relatedTarget)) { hoveredLegend = null; highlight(active); }
  });
  svg.addEventListener('focusin', event => {
    if (!restoring && event.target.matches(':focus-visible')) {
      const entry = legendTarget(event);
      if (entry) previewLegend(entry, true);
      else show(target(event));
    }
  });
  svg.addEventListener('focusout', event => {
    if (legendTarget(event)) { focusedLegend = null; highlight(active); }
    else later(event);
  });
  svg.addEventListener('click', event => {
    const entry = legendTarget(event);
    if (entry) toggleLegend(entry);
    else if (target(event)) show(target(event), true);
  });
  svg.addEventListener('keydown', event => {
    const entry = legendTarget(event);
    if ((event.key === 'Enter' || event.key === ' ') && (entry || target(event))) {
      event.preventDefault();
      if (entry) toggleLegend(entry);
      else {
        show(target(event), true);
        panel.querySelector('.detail-close').focus();
      }
    }
  });
  panel.addEventListener('pointerenter', cancel);
  panel.addEventListener('pointerleave', later);
  panel.addEventListener('focusin', cancel);
  panel.addEventListener('focusout', later);
  panel.querySelector('.detail-close').addEventListener('click', () => close(true, true));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && (active || hoveredLegend || focusedLegend || pinnedLegend)) {
      event.preventDefault();
      hoveredLegend = focusedLegend = pinnedLegend = null;
      close(panel.contains(document.activeElement), true);
    }
  });
  document.addEventListener('click', event => {
    if (!panel.contains(event.target) && !svg.contains(target(event) || legendTarget(event))) {
      hoveredLegend = focusedLegend = pinnedLegend = null;
      close(false, true);
    }
  });
  window.addEventListener('resize', position);
  window.addEventListener('scroll', event => { if (active && !panel.contains(event.target)) position(); }, true);
})();
</script>

</body></html>
